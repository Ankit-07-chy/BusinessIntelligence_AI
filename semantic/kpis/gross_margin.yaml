kpi_id: gross_margin
name: Gross Margin
owner: Finance
unit: currency_usd
direction: increase_is_good
anomaly_direction: decrease

business_definition: >
  Revenue after discounts and returns minus cost of goods sold.

formula: >
  SUM(gross_revenue - discount_amount - returns_amount - cogs)

primary_source: fact_sales

secondary_sources:
  - dim_product
  - dim_store

grain: product-store-day
period: daily
refresh_cadence: daily

dimensions:
  - region
  - store_id
  - product_id
  - category

thresholds:
  percent_drop: 3
  absolute_drop_usd: 50000
  percent_increase: null
  absolute_increase_usd: null

drivers:
  - discount_rate
  - product_mix_shift
  - cost_changes
  - returns_volume
  - promotion_depth
  - category_mix

access_policy:
  row_level: region
  column_level:
    fact_sales.gross_margin: finance_only
    fact_sales.cogs: finance_only
    dim_product.cost: finance_only

lineage:
  sales_source: fact_sales
  product_source: dim_product
  store_source: dim_store

quality_rules:
  min_data_quality_score: 0.7
  freshness_penalty: true
  abstain_if_missing:
    - fact_sales

version: 1.0.1
